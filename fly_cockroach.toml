# ============================================================
# MUST CHANGE: Replace 'bchat-crdb' with your Fly.io app name
# ============================================================
app = 'bchat-crdb'
primary_region = 'sjc'

[build]
  dockerfile = 'Dockerfile.cockroach.fly'

[env]
  MEMOS_DRIVER = 'cockroach'
  MEMOS_MODE = 'prod'
  MEMOS_PORT = '5230'
  RAG_PIPELINE_ENABLED = 'true'
  EMBEDDING_PROVIDER = 'openrouter'
  EMBEDDING_MODEL = 'openai/text-embedding-3-small'
  EMBEDDING_BATCH_SIZE = '10'
  EMBEDDING_TIMEOUT = '10m'
  LANCEDB_STORAGE_PROVIDER = 'cockroach'
  LLM_MODEL = "openrouter/free"
  LLM_MODEL_REASONING = "openrouter/free"
  LLM_VERIFIER_ENABLED = 'false'
  # First-boot reindex completed — disabled to avoid full reindex on every restart
  FORCE_REINDEX_ON_STARTUP = 'false'
  RAG_STARTUP_REINDEX_DISABLED = 'true'
  TZ = 'UTC'

# COCKROACH_DSN is a Fly secret (set via scripts/fly-cockroach-secrets.sh)
# Format: postgresql://user:password@host:26257/db?sslmode=require

# NO [[mounts]] section — CockroachDB replaces the SQLite volume

[http_service]
  internal_port = 5230
  force_https = true
  # Phase 5: first-boot migration and reindex confirmed working.
  # 'stop' allows machine to sleep when idle (cost savings).
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']
  request_timeout = "30s"

  [http_service.concurrency]
    type = 'connections'
    hard_limit = 25
    soft_limit = 20

  [[http_service.checks]]
    # Long grace period: first boot runs the full CockroachDB schema migration
    # before /healthz is registered (server.go:104-107). On Cloud Serverless the
    # DDL takes ~25-60 min (attempt-1 died at ~6 min with grace 15s — bugs/057
    # artifacts/deploy-attempt1). grace must exceed poll (50m) which exceeds
    # fly deploy --wait-timeout (45m, informational) — see scripts/crdb-deploy.sh.
    grace_period = "60m"
    interval = "5s"
    method = "GET"
    path = "/healthz"

[[vm]]
  memory = '1024mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
