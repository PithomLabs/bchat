app = 'bchat-crdb-dryrun'
primary_region = 'sjc'

[build]
  dockerfile = 'Dockerfile'

[env]
  PORT = '5231'

# COCKROACH_DSN set as Fly secret

[http_service]
  internal_port = 5231
  force_https = true
  # OFF during migration window: Fly proxy autostops machines after ~5 min
  # without active connections — the app has no listener until migration
  # completes, so grace_period never protects it. Flip to 'stop' post-boot.
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']
  request_timeout = "30s"

  [http_service.concurrency]
    type = 'connections'
    hard_limit = 25
    soft_limit = 20

  [[http_service.checks]]
    grace_period = "60m"
    interval = "5s"
    method = "GET"
    path = "/healthz"

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 512
