# ============================================================
# MUST CHANGE: Replace 'bchat-pg' with your Fly.io app name
# ============================================================
app = 'bchat-pg'
primary_region = 'sjc'
kill_timeout = "30s"

[build]
  dockerfile = 'Dockerfile.pg.fly'

[env]
  MEMOS_DRIVER = 'postgres'
  MEMOS_MODE = 'prod'
  MEMOS_PORT = '5230'
  RAG_PIPELINE_ENABLED = 'true'
  EMBEDDING_PROVIDER = 'openrouter'
  EMBEDDING_MODEL = 'openai/text-embedding-3-small'
  EMBEDDING_BATCH_SIZE = '10'
  EMBEDDING_TIMEOUT = '10m'
  LANCEDB_STORAGE_PROVIDER = 's3'
  LANCEDB_S3_FORCE_PATH_STYLE = 'false'
  LLM_MODEL = "poolside/laguna-m.1:free"
  LLM_MODEL_REASONING = "nvidia/nemotron-3-ultra-550b-a55b:free"
  LLM_VERIFIER_ENABLED = 'false'
  FORCE_REINDEX_ON_STARTUP = 'false'
  RAG_STARTUP_REINDEX_DISABLED = 'true'
  TZ = 'UTC'

# NO [[mounts]] section — Neon replaces the SQLite volume

[http_service]
  internal_port = 5230
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']
  request_timeout = "30s"

  [http_service.concurrency]
    type = 'connections'
    hard_limit = 25
    soft_limit = 20

  [[http_service.checks]]
    grace_period = "15s"
    interval = "5s"
    method = "GET"
    path = "/healthz"

[[vm]]
  memory = '1024mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
